steps:
  - name: python
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r utils/requirements.txt --user
        python utils/add_dags_to_composer.py --dags_directory=${_DAGS_DIRECTORY} --dags_bucket=${_DAGS_BUCKET}

options:
  logging: CLOUD_LOGGING_ONLY
